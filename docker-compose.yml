# Local development database (architecture §7). Tests use auth_test in the same container.
name: full-stack-auth-module

services:
  mongo:
    image: mongo:8
    ports:
      # Host port 27018, so another project's Mongo on 27017 can run alongside.
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
