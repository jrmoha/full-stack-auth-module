packages:
  - apps/*

# Dependency build scripts are reviewed explicitly (pnpm 10 blocks them by default).
allowBuilds:
  # The postinstall is a fallback; the optional platform binary already works (verified in 0.5).
  '@swc/core': false
  # Native addon; the install script selects the prebuilt binary (node-gyp-build). Needed for hashing.
  argon2: true
  # Install-time telemetry from swagger-ui-dist (via @nestjs/swagger); not needed to run.
  '@scarf/scarf': false
